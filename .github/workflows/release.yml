name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      # 6 平台 pytest 在 main push 已跑过;发版只取单 runner 质量门禁。
      skip-test-matrix: true

  binary:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            artifact: orzmc-macos-x86_64
          - os: macos-15
            arch: arm64
            artifact: orzmc-macos-arm64
          - os: ubuntu-latest
            arch: x86_64
            artifact: orzmc-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: orzmc-linux-arm64
          - os: windows-latest
            arch: x86_64
            artifact: orzmc-windows-x86_64
          - os: windows-11-arm
            arch: arm64
            artifact: orzmc-windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        # --name 让每个平台产出独立文件名(orzmc-<os>-<arch>),Release 上不再互相覆盖
        run: uv run --package orzmc-app python scripts/build.py --name ${{ matrix.artifact }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/orzmc*
          if-no-files-found: error
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/orzmc*
          fail_on_unmatched_files: true

  pypi:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build distributions
        run: uv build --all-packages
      # 按包拆分发布:每个包只用自己 scope 的 API token。
      # 注意 glob:dist/orzmc-* 不会误匹配 orzmc_app-*(下划线)。
      - name: Publish orzmc to PyPI
        run: uv publish dist/orzmc-*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_ORZMC_LIB }}
      - name: Publish orzmc_app to PyPI
        run: uv publish dist/orzmc_app-*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN_ORZMC_APP }}
