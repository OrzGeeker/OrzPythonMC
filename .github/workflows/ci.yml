name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      # Release reuses this workflow as its quality gate; the 6-platform test
      # matrix already ran on main, so the tag only needs the single-runner checks.
      skip-test-matrix:
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-independent checks: run once, fail fast before fanning out.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: MyPy
        run: uv run mypy
      - name: Tests
        run: uv run --all-packages pytest
      - name: Build both packages
        run: uv build --all-packages

  # Pure-Python tests with fakes, but they exercise OS-sensitive paths
  # (path sep, platform.machine, subprocess creation flags, zip/tar extract)
  # — worth the full 6-platform sweep to catch OS bugs cheaply.
  test:
    needs: quality
    # inputs 上下文仅在 workflow_call 触发时存在;push/PR 时用 || 'false' 兜底,
    # 避免直接引用 inputs.* 在非 workflow_call 触发下解析为空。
    if: ${{ !fromJSON(inputs.skip-test-matrix || 'false') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Tests
        run: uv run --all-packages pytest

  # PyInstaller packaging is OS/arch-specific — verify a build works on all 6
  # platforms after every merge to main (not per-PR: keeps PR CI fast). The
  # branch check keeps this from running on release tag pushes.
  binary:
    needs: quality
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 30
    # only-managed 兜底:macOS runner 镜像预装 framework Python,uv 默认会退回
    # 系统解释器 → PyInstaller framework 模式(启动 ~14s)。强制 uv 只用 standalone。
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        run: uv run --package orzmc-app python scripts/build.py
      # macOS:framework 模式构建会链接 Python.framework,产物启动 ~14s(embed ~1.5s)。
      # 断言产物不链接它,让慢二进制永远发不出去。
      - name: Assert embed-mode build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if otool -L dist/orzmc* | grep -q "Python.framework"; then
            echo "::error::Binary links Python.framework (framework-mode PyInstaller, ~14s startup). Check pyproject.toml [tool.uv] python-preference = \"only-managed\"."
            exit 1
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: orzmc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/orzmc*
          if-no-files-found: error

  # End-to-end installer check on all 6 platforms: build the binary locally,
  # install via the one-line installer (--file seam + hermetic env so we never
  # touch the real PATH/rc/user dirs), run `orzmc self-uninstall --yes`, and
  # assert the binary + install manifest are gone. Push-only like `binary`:
  # the latest released binary predates self-uninstall, so e2e must use a
  # local build (the "chicken-and-egg" seam) rather than pulling a release.
  installer:
    needs: quality
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: arm64
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Build binary
        run: uv run --package orzmc-app python scripts/build.py

      # Unix: install to a temp dir with XDG_STATE_HOME redirected and rc
      # untouched; self-uninstall then deletes the binary + manifest.
      - name: Installer e2e (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          XDG_STATE_HOME: "${{ runner.temp }}/orzmc-state"
        run: |
          set -euxo pipefail
          sh docs/install.sh --file "$PWD/dist/orzmc" --dir "$RUNNER_TEMP/orzmc-install" --no-modify-rc
          "$RUNNER_TEMP/orzmc-install/orzmc" version
          "$RUNNER_TEMP/orzmc-install/orzmc" self-uninstall --yes
          test ! -e "$RUNNER_TEMP/orzmc-install/orzmc"
          test ! -e "$XDG_STATE_HOME/orzmc/install.conf"

      # Windows: LOCALAPPDATA redirected + ORZMC_NO_RC=1 keeps the install
      # fully hermetic; `powershell -File` runs the installer on PS 5.1.
      - name: Installer e2e (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOCALAPPDATA: "${{ runner.temp }}\\orzmc-state"
          ORZMC_NO_RC: "1"
        run: |
          powershell -NoProfile -File docs/install.ps1 -file "$PWD\dist\orzmc.exe" -dir "$env:RUNNER_TEMP\orzmc-install"
          & "$env:RUNNER_TEMP\orzmc-install\orzmc.exe" version
          & "$env:RUNNER_TEMP\orzmc-install\orzmc.exe" self-uninstall --yes
          if (Test-Path "$env:RUNNER_TEMP\orzmc-install\orzmc.exe") { throw "self-uninstall left the binary" }
          if (Test-Path "$env:LOCALAPPDATA\orzmc\install.conf") { throw "self-uninstall left the install manifest" }
